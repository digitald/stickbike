<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#7ec8e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Omino Stick: Hill Climb</title>
    <style>
        :root {
            --sky-top: #6ec1e4;
            --sky-bot: #fff4c8;
            --ink: #2a2a2a;
            --panel: rgba(255, 253, 245, 0.88);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #1a2330;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            color: var(--ink);
        }

        .header-bar {
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 16px 6px;
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            z-index: 20;
            color: #eef6ff;
        }

        h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kb-legend {
            display: none;
            font-size: 12px;
            opacity: 0.85;
            white-space: nowrap;
        }

        body.is-desktop .kb-legend { display: block; }

        kbd {
            display: inline-block;
            min-width: 1.4em;
            padding: 1px 6px;
            border: 1px solid rgba(255,255,255,0.35);
            border-bottom-width: 2px;
            border-radius: 4px;
            background: rgba(255,255,255,0.12);
            font-family: inherit;
            font-size: 11px;
        }

        .btn-icon {
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.28);
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-icon:hover { background: rgba(255,255,255,0.24); }

        #gameContainer {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            margin: 0 12px 12px;
            margin-left: max(12px, env(safe-area-inset-left));
            margin-right: max(12px, env(safe-area-inset-right));
            margin-bottom: max(12px, env(safe-area-inset-bottom));
            border-radius: 16px;
            overflow: hidden;
            background: var(--sky-bot);
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
            border: 2px solid rgba(255,255,255,0.18);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .mobile-controls {
            display: none;
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 15;
        }

        body.is-touch .mobile-controls { display: block; }
        body.is-touch.playing .mobile-controls { display: block; }

        .control-group-left,
        .control-group-right {
            position: absolute;
            bottom: max(18px, env(safe-area-inset-bottom));
            pointer-events: auto;
            display: flex;
            align-items: flex-end;
            gap: 14px;
        }

        .control-group-left { left: max(16px, env(safe-area-inset-left)); }
        .control-group-right { right: max(16px, env(safe-area-inset-right)); }

        .control-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.55);
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: #222;
            box-shadow: 0 6px 14px rgba(0,0,0,0.18);
            transition: transform 0.08s, background 0.08s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        .control-btn span {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .btn-pedal {
            width: 92px;
            height: 92px;
            color: #1b5e20;
            border-color: rgba(46, 125, 50, 0.45);
            background: rgba(200, 230, 201, 0.7);
        }

        .btn-brake {
            color: #b71c1c;
            border-color: rgba(211, 47, 47, 0.4);
            background: rgba(255, 205, 210, 0.7);
        }

        .btn-jump {
            color: #0d47a1;
            border-color: rgba(21, 101, 192, 0.4);
            background: rgba(187, 222, 251, 0.7);
            width: 70px;
            height: 70px;
            margin-bottom: 12px;
        }

        .control-btn:active,
        .control-btn.pressed {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.92);
        }

        .icon { width: 28px; height: 28px; fill: currentColor; }
        .btn-pedal .icon { width: 34px; height: 34px; }

        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 25;
            background: rgba(20, 32, 48, 0.28);
            padding: 20px;
        }

        #overlay.hidden { display: none; }

        .overlay-card {
            background: var(--panel);
            padding: 22px 26px 20px;
            border: 3px solid #333;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.12);
            max-width: 420px;
            width: min(86%, 420px);
        }

        #overlay h2 {
            margin: 0 0 10px;
            color: #c62828;
            font-size: clamp(1.2rem, 3vw, 1.7rem);
        }

        #overlay p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.45;
            color: #444;
        }

        .overlay-score {
            margin: 6px 0 14px;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #666;
        }

        .overlay-score[hidden],
        .btn-start-again[hidden] { display: none; }

        .overlay-score strong {
            display: block;
            margin-top: 2px;
            font-size: clamp(2.1rem, 6vw, 2.8rem);
            font-weight: 800;
            letter-spacing: 0;
            text-transform: none;
            color: #c62828;
            line-height: 1.1;
        }

        .btn-start-again {
            margin-top: 16px;
            padding: 12px 28px;
            font-family: inherit;
            font-size: 1.08rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: #fff;
            background: #2e7d32;
            border: 3px solid #1b5e20;
            border-radius: 14px;
            box-shadow: 0 5px 0 #1b5e20;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-start-again:hover { background: #388e3c; }
        .btn-start-again:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1b5e20;
        }

        #rotateHint {
            display: none;
            position: absolute;
            top: max(8px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 28;
            background: rgba(20, 32, 48, 0.78);
            color: #fff;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            white-space: nowrap;
            pointer-events: none;
        }

        body.is-touch.is-portrait.playing #rotateHint { display: block; }

        /* Landscape phone: hide chrome, thumbs at the sides */
        @media (orientation: landscape) and (max-height: 500px) {
            .header-bar {
                position: absolute;
                top: 6px;
                right: 10px;
                left: auto;
                width: auto;
                padding: 0;
                z-index: 40;
            }
            .header-bar h1,
            .header-bar .kb-legend { display: none; }
            #gameContainer {
                margin: 0;
                border-radius: 0;
                border: none;
            }
            .control-group-left,
            .control-group-right {
                bottom: max(12px, env(safe-area-inset-bottom));
                transform: none;
            }
            .btn-jump { margin-bottom: 16px; }
            #overlay { padding: 8px; }
            .overlay-card { padding: 12px 16px; }
            #overlay h2 { font-size: 1.15rem; margin-bottom: 6px; }
            #overlay p { font-size: 0.82rem; }
            .overlay-score { margin: 2px 0 8px; }
            .overlay-score strong { font-size: 1.7rem; }
            .btn-start-again {
                margin-top: 8px;
                padding: 8px 18px;
                font-size: 0.95rem;
            }
        }

        @media (pointer: coarse) {
            .control-btn { width: 80px; height: 80px; }
            .btn-pedal { width: 96px; height: 96px; }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <h1>Omino Stick: Hill Climb</h1>
        <div class="header-actions">
            <div class="kb-legend">
                <kbd>←</kbd> freno
                <kbd>→</kbd> pedala
                <kbd>↑</kbd> salto
            </div>
            <button class="btn-icon" id="fsBtn" title="Schermo intero" aria-label="Schermo intero">⛶</button>
        </div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>

        <div id="rotateHint">Ruota il telefono per vedere più strada davanti</div>

        <div id="overlay">
            <div class="overlay-card">
                <h2 id="overlayTitle">Hill Climb</h2>
                <p id="overlayScore" class="overlay-score" hidden></p>
                <p id="overlaySub"></p>
                <button type="button" id="btnStartAgain" class="btn-start-again" hidden>Start again</button>
            </div>
        </div>

        <div class="mobile-controls" aria-hidden="true">
            <div class="control-group-left">
                <button type="button" class="control-btn btn-jump" id="btnUp">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
                    <span>Salto</span>
                </button>
                <button type="button" class="control-btn btn-brake" id="btnLeft">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                    <span>Freno</span>
                </button>
            </div>
            <div class="control-group-right">
                <button type="button" class="control-btn btn-pedal" id="btnRight">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <span>Gas</span>
                </button>
            </div>
        </div>
    </div>

<script>
    const WORLD_H = 400;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const title = document.getElementById('overlayTitle');
    const sub = document.getElementById('overlaySub');
    const overlayScore = document.getElementById('overlayScore');
    const btnStartAgain = document.getElementById('btnStartAgain');
    const fsBtn = document.getElementById('fsBtn');
    const container = document.getElementById('gameContainer');
    const btnLeft = document.getElementById('btnLeft');
    const btnUp = document.getElementById('btnUp');
    const btnRight = document.getElementById('btnRight');

    let viewW = 800;
    let viewH = 400;
    let worldW = 800;
    let dpr = 1;

    // --- INPUT MODE (adaptive: one game, two control surfaces) ---
    function isTouchPreferred() {
        if (window.matchMedia('(pointer: coarse)').matches) return true;
        if (window.matchMedia('(hover: none)').matches) return true;
        if (window.matchMedia('(max-width: 820px)').matches) return true;
        // landscape phones (e.g. 844×390) are wide but short
        if (window.matchMedia('(max-height: 500px) and (max-width: 1100px)').matches) return true;
        return false;
    }

    function syncChrome() {
        const touch = isTouchPreferred();
        document.body.classList.toggle('is-touch', touch);
        document.body.classList.toggle('is-desktop', !touch);
        document.body.classList.toggle('is-portrait', window.innerHeight > window.innerWidth);
        document.body.classList.toggle('playing', gameState === 'playing');
        setOverlayCopy();
    }

    function setOverlayCopy() {
        if (gameState === 'playing') return;
        const touch = isTouchPreferred();
        if (gameState === 'start') {
            overlayScore.hidden = true;
            btnStartAgain.hidden = true;
            title.textContent = 'Omino Stick';
            sub.innerHTML = touch
                ? 'Stelle = punti · Rocce = pericolo<br><strong>Tocca per iniziare</strong><br>Freno e salto a sinistra · Gas a destra'
                : 'Stelle = punti · Rocce = pericolo<br><strong>Spazio</strong> o clic per iniziare<br><kbd>A</kbd>/<kbd>←</kbd> freno · <kbd>D</kbd>/<kbd>→</kbd> pedala · <kbd>W</kbd>/<kbd>↑</kbd> salto';
        } else if (gameState === 'gameover') {
            overlayScore.hidden = false;
            btnStartAgain.hidden = false;
            title.textContent = 'GAME OVER';
            overlayScore.innerHTML = 'Punteggio <strong>' + score + '</strong>';
            sub.textContent = touch
                ? 'Tocca Start again per riprovare'
                : 'Start again · Spazio o Invio';
        }
    }

    // --- FULLSCREEN ---
    fsBtn.addEventListener('click', async () => {
        try {
            if (!document.fullscreenElement) {
                await container.requestFullscreen();
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            } else {
                await document.exitFullscreen();
            }
        } catch (err) {
            console.log(err.message);
        }
    });

    // --- AUDIO ---
    let audioCtx = null;
    let windSystem = null;
    let audioStarted = false;

    function initAudio() {
        if (audioStarted) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const windFilter = audioCtx.createBiquadFilter();
            windFilter.type = 'lowpass';
            windFilter.frequency.value = 200;

            const windGain = audioCtx.createGain();
            windGain.gain.value = 0;

            whiteNoise.connect(windFilter);
            windFilter.connect(windGain);
            windGain.connect(audioCtx.destination);
            whiteNoise.start(0);
            windSystem = { filter: windFilter, gain: windGain };
            audioStarted = true;
        } catch (e) { console.error('Audio error:', e); }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (type === 'ding') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        } else if (type === 'megaDing') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        } else if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        } else if (type === 'hit') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 1);
    }

    // Re♯ Re Do♯ Do — last note held and falling
    function playGameOverJingle() {
        if (!audioCtx) {
            initAudio();
            if (!audioCtx) return;
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (windSystem) {
            windSystem.gain.gain.cancelScheduledValues(audioCtx.currentTime);
            windSystem.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
        }

        const now = audioCtx.currentTime + 0.22;
        const master = audioCtx.createGain();
        master.gain.value = 0.2;
        master.connect(audioCtx.destination);

        function voice(type, gainVal, detune) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.detune.value = detune || 0;
            osc.connect(gain);
            gain.connect(master);

            // D#4, D4, C#4, C4
            osc.frequency.setValueAtTime(311.13, now);
            osc.frequency.setValueAtTime(293.66, now + 0.34);
            osc.frequency.setValueAtTime(277.18, now + 0.68);
            osc.frequency.setValueAtTime(261.63, now + 1.02);
            osc.frequency.exponentialRampToValueAtTime(174.61, now + 2.85);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(gainVal, now + 0.03);
            gain.gain.setValueAtTime(gainVal, now + 1.15);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.9);

            osc.start(now);
            osc.stop(now + 3.0);
        }

        voice('triangle', 1, 0);
        voice('sine', 0.45, -1200);
    }

    function buzz(ms) {
        if (navigator.vibrate) navigator.vibrate(ms);
    }

    // --- GAME STATE ---
    let gameState = 'start';
    let frame = 0;
    let score = 0;
    let lives = 3;
    let worldXpos = 0;
    let shake = 0;
    let lastTime = 0;

    const gravity = 0.5;
    const slopeGravityForce = 0.32;
    const airFriction = 0.992;
    const groundFriction = 0.965;
    const brakePower = 0.85;
    const pedalPower = 0.34;
    const maxSpeed = 16;
    const crashSpeedThreshold = 11.5;

    let player = {
        x: 140,
        y: 0,
        vy: 0,
        jumpPower: -12.5,
        speed: 0,
        rotation: 0,
        onGround: false,
        isInvincible: false,
        invincibleTimer: 0,
        rockCooldown: 0
    };

    let gameObjects = [];
    let mountains = [];
    let hills = [];
    let clouds = [];
    let popups = [];

    const keys = { up: false, left: false, right: false };

    function resize() {
        const rect = container.getBoundingClientRect();
        viewW = Math.max(320, rect.width);
        viewH = Math.max(180, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(viewW * dpr);
        canvas.height = Math.floor(viewH * dpr);
        worldW = viewW * (WORLD_H / viewH);
        player.x = playerScreenX();
        syncChrome();
    }

    function initWorld() {
        mountains = Array.from({ length: 6 }, (_, i) => ({
            x: i * 280 + Math.random() * 80,
            y: WORLD_H * 0.42 + Math.random() * 40,
            scale: 0.7 + Math.random() * 0.5
        }));
        hills = Array.from({ length: 5 }, (_, i) => ({
            x: i * 320 + Math.random() * 60,
            w: 180 + Math.random() * 120,
            h: 50 + Math.random() * 40
        }));
        clouds = Array.from({ length: 8 }, () => ({
            x: Math.random() * worldW * 2,
            y: 24 + Math.random() * 70,
            speed: 0.15 + Math.random() * 0.25,
            scale: 0.7 + Math.random() * 0.5
        }));
    }

    function resetGame() {
        gameState = 'playing';
        score = 0;
        lives = 3;
        worldXpos = 0;
        shake = 0;
        player.x = playerScreenX();
        player.vy = 0;
        player.speed = 0;
        player.rotation = 0;
        player.onGround = true;
        player.isInvincible = false;
        player.invincibleTimer = 0;
        player.rockCooldown = 0;
        player.y = getTerrainHeight(worldXpos + player.x);
        gameObjects = [];
        popups = [];
        initWorld();
        overlay.classList.add('hidden');
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        syncChrome();
    }

    function setupButton(btn, keyName) {
        const startAction = (e) => {
            if (e.cancelable) e.preventDefault();
            if (e.pointerId != null) {
                try { btn.setPointerCapture(e.pointerId); } catch (_) {}
            }
            if (gameState === 'playing') {
                keys[keyName] = true;
                btn.classList.add('pressed');
            }
        };
        const endAction = (e) => {
            if (e.cancelable) e.preventDefault();
            keys[keyName] = false;
            btn.classList.remove('pressed');
        };
        btn.addEventListener('pointerdown', startAction);
        btn.addEventListener('pointerup', endAction);
        btn.addEventListener('pointercancel', endAction);
        btn.addEventListener('lostpointercapture', endAction);
    }

    setupButton(btnLeft, 'left');
    setupButton(btnUp, 'up');
    setupButton(btnRight, 'right');

    function tryStart() {
        if (gameState === 'start' || gameState === 'gameover') resetGame();
    }

    overlay.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        tryStart();
    });
    btnStartAgain.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        tryStart();
    });

    function isJumpKey(e) {
        const k = e.key.toLowerCase();
        return k === 'w' || e.key === 'ArrowUp' || e.code === 'Space';
    }
    function isBrakeKey(e) {
        const k = e.key.toLowerCase();
        return k === 'a' || k === 's' || e.key === 'ArrowLeft' || e.key === 'ArrowDown';
    }
    function isPedalKey(e) {
        const k = e.key.toLowerCase();
        return k === 'd' || e.key === 'ArrowRight';
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === 'Enter') {
            e.preventDefault();
            if (gameState === 'start' || gameState === 'gameover') {
                tryStart();
                return;
            }
        }
        if (gameState !== 'playing') return;
        if (isJumpKey(e)) { e.preventDefault(); keys.up = true; btnUp.classList.add('pressed'); }
        if (isBrakeKey(e)) { e.preventDefault(); keys.left = true; btnLeft.classList.add('pressed'); }
        if (isPedalKey(e)) { e.preventDefault(); keys.right = true; btnRight.classList.add('pressed'); }
    });

    window.addEventListener('keyup', (e) => {
        if (isJumpKey(e)) { keys.up = false; btnUp.classList.remove('pressed'); }
        if (isBrakeKey(e)) { keys.left = false; btnLeft.classList.remove('pressed'); }
        if (isPedalKey(e)) { keys.right = false; btnRight.classList.remove('pressed'); }
    });

    window.addEventListener('blur', () => {
        keys.up = keys.left = keys.right = false;
        btnUp.classList.remove('pressed');
        btnLeft.classList.remove('pressed');
        btnRight.classList.remove('pressed');
    });

    window.matchMedia('(pointer: coarse)').addEventListener('change', syncChrome);
    window.matchMedia('(hover: none)').addEventListener('change', syncChrome);
    window.matchMedia('(max-width: 820px)').addEventListener('change', syncChrome);
    window.matchMedia('(max-height: 500px)').addEventListener('change', syncChrome);
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 120));

    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    // --- TERRAIN ---
    function getTerrainHeight(worldX) {
        const base = WORLD_H * 0.72;
        const h1 = Math.sin(worldX * 0.0024) * (WORLD_H * 0.16);
        const h2 = Math.sin(worldX * 0.0075) * (WORLD_H * 0.04);
        const h3 = Math.sin(worldX * 0.019) * 6;
        return base + h1 + h2 + h3;
    }

    function playerScreenX() {
        const base = Math.min(WORLD_H * 0.42, Math.max(110, worldW * 0.22));
        const lookAhead = Math.max(0, player.speed) / maxSpeed * Math.min(48, worldW * 0.05);
        return Math.max(90, base - lookAhead);
    }

    // --- DRAW HELPERS ---
    function drawHandLine(x1, y1, x2, y2, width = 2.2) {
        ctx.beginPath();
        const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * 1.4;
        const my = (y1 + y2) / 2 + (Math.random() - 0.5) * 1.4;
        ctx.moveTo(x1, y1); ctx.lineTo(mx, my); ctx.lineTo(x2, y2);
        ctx.lineWidth = width; ctx.strokeStyle = '#111'; ctx.lineCap = 'round'; ctx.stroke();
    }

    function drawCircle(x, y, r, fill) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
    }

    function drawCloud(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.strokeStyle = 'rgba(80,80,80,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-30, 10); ctx.lineTo(30, 10);
        ctx.bezierCurveTo(40, 10, 40, -20, 20, -25);
        ctx.bezierCurveTo(10, -35, -10, -35, -20, -25);
        ctx.bezierCurveTo(-40, -20, -40, 10, -30, 10);
        ctx.fill(); ctx.stroke();
        ctx.restore();
    }

    function drawHeart(x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(size, size);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-5, -5, -10, 0, 0, 10);
        ctx.bezierCurveTo(10, 0, 5, -5, 0, 0);
        ctx.fillStyle = '#e53935';
        ctx.fill();
        ctx.restore();
    }

    function drawRock(x, y) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 10, y - 16);
        ctx.lineTo(x + 20, y - 6);
        ctx.lineTo(x + 32, y - 22);
        ctx.lineTo(x + 44, y);
        ctx.closePath();
        ctx.fillStyle = '#8d8d8d';
        ctx.fill();
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawStar(x, y, type) {
        const size = type === 'high' ? 13 : 8;
        const spikes = 5;
        let rot = Math.PI / 2 * 3;
        const step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(x, y - size);
        for (let i = 0; i < spikes; i++) {
            ctx.lineTo(x + Math.cos(rot) * size, y + Math.sin(rot) * size); rot += step;
            ctx.lineTo(x + Math.cos(rot) * (size / 2), y + Math.sin(rot) * (size / 2)); rot += step;
        }
        ctx.closePath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#111';
        ctx.stroke();
        ctx.fillStyle = type === 'high' ? '#ff9800' : '#ffd54f';
        ctx.fill();
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.rotation);
        if (player.isInvincible && frame % 10 < 5) ctx.globalAlpha = 0.45;

        drawCircle(-20, 0, 12);
        drawCircle(20, 0, 12);
        drawHandLine(-20, 0, 0, -20);
        drawHandLine(20, 0, 0, -20);
        drawHandLine(-15, 0, 5, -25);
        drawHandLine(20, 0, 8, -30);

        ctx.translate(0, -5);
        drawHandLine(0, -20, -5, -40);
        drawCircle(-5, -48, 7);
        drawHandLine(-5, -35, 15, -25);
        const knee = Math.sin(frame * Math.max(player.speed, 0.4) * 0.28) * 5;
        drawHandLine(-5, -20, -2 + knee, -5 - knee);
        drawHandLine(-2 + knee, -5 - knee, 0, 5);
        ctx.restore();
    }

    function handleCrash() {
        if (player.isInvincible) return;
        shake = 14;
        buzz(40);

        if (lives > 1) {
            lives--;
            playSound('hit');
            player.speed = -Math.abs(player.speed) * 0.35;
            player.isInvincible = true;
            player.invincibleTimer = 90;
        } else {
            lives = 0;
            playSound('crash');
            playGameOverJingle();
            buzz(80);
            gameState = 'gameover';
            keys.up = keys.left = keys.right = false;
            setTimeout(() => {
                overlay.classList.remove('hidden');
                setOverlayCopy();
                syncChrome();
            }, 450);
        }
    }

    function updateBackground(dt) {
        const speed = (gameState === 'playing') ? player.speed : 1.2;
        clouds.forEach(c => {
            c.x -= (speed * 0.08 + c.speed) * dt;
            if (c.x < -120) c.x = worldW + 80 + Math.random() * 120;
        });
        mountains.forEach(m => {
            m.x -= speed * 0.04 * dt;
            if (m.x < -360) m.x = worldW + 180;
        });
        hills.forEach(h => {
            h.x -= speed * 0.07 * dt;
            if (h.x < -h.w) h.x = worldW + 80;
        });
    }

    function update(dt) {
        updateBackground(dt);
        if (shake > 0) shake -= dt * 0.9;

        popups = popups.filter(p => {
            p.y -= 0.6 * dt;
            p.life -= dt;
            return p.life > 0;
        });

        if (gameState !== 'playing') return;

        player.x = playerScreenX();

        if (player.isInvincible) {
            player.invincibleTimer -= dt;
            if (player.invincibleTimer <= 0) player.isInvincible = false;
        }
        if (player.rockCooldown > 0) player.rockCooldown -= dt;

        const currentGroundY = getTerrainHeight(worldXpos + player.x);
        const nextGroundY = getTerrainHeight(worldXpos + player.x + 8);
        const slopeAngle = Math.atan2(nextGroundY - currentGroundY, 8);

        player.speed += Math.sin(slopeAngle) * slopeGravityForce * dt;

        if (keys.right) player.speed += pedalPower * dt;
        else if (player.onGround) player.speed *= Math.pow(groundFriction, dt);
        else player.speed *= Math.pow(airFriction, dt);

        if (keys.left) {
            if (player.speed > 0) player.speed -= brakePower * dt;
            else player.speed += brakePower * 0.18 * dt;
        }

        if (player.speed > maxSpeed) player.speed = maxSpeed;
        if (player.speed < -5) player.speed = -5;

        if (keys.up && player.onGround) {
            player.vy = player.jumpPower;
            player.onGround = false;
            if (slopeAngle < 0) player.speed += 1.6;
        }

        player.vy += gravity * dt;
        player.y += player.vy * dt;

        const groundNow = getTerrainHeight(worldXpos + player.x);
        if (player.y >= groundNow - 5) {
            if (!player.onGround && player.vy > 11) {
                player.speed *= 0.82;
            }
            player.y = groundNow;
            player.vy = 0;
            player.onGround = true;
            player.rotation = slopeAngle;
        } else {
            player.rotation += (slopeAngle * 0.15 - player.rotation) * (1 - Math.pow(0.92, dt));
        }

        worldXpos += player.speed * dt;

        if (windSystem && audioCtx) {
            const vol = Math.abs(player.speed) / 20;
            windSystem.gain.gain.setTargetAtTime(Math.min(vol, 0.18), audioCtx.currentTime, 0.1);
            windSystem.filter.frequency.setTargetAtTime(200 + Math.abs(player.speed) * 700, audioCtx.currentTime, 0.1);
        }

        const spawnX = worldXpos + worldW + 90;
        const spacing = 240 + Math.random() * 80;
        if (gameObjects.length === 0 || gameObjects[gameObjects.length - 1].worldX < spawnX - spacing) {
            const rand = Math.random();
            const newObjX = spawnX + Math.random() * 70;
            if (rand < 0.28) gameObjects.push({ type: 'rock', worldX: newObjX });
            else if (rand < 0.72) gameObjects.push({ type: 'star_low', worldX: newObjX, val: 1, taken: false });
            else gameObjects.push({ type: 'star_high', worldX: newObjX, val: 10, taken: false });
        }

        gameObjects = gameObjects.filter(obj => obj.worldX > worldXpos - 220);
        frame += dt;
    }

    function collideObjects() {
        if (gameState !== 'playing') return;
        gameObjects.forEach(obj => {
            const screenX = obj.worldX - worldXpos;
            if (screenX < -60 || screenX > worldW + 60) return;
            const groundY = getTerrainHeight(obj.worldX);

            if (obj.type === 'rock') {
                const hit = Math.abs(player.x - screenX - 22) < 26 && player.y > groundY - 28;
                if (hit && player.rockCooldown <= 0) {
                    player.rockCooldown = 18;
                    if (Math.abs(player.speed) > crashSpeedThreshold) handleCrash();
                    else player.speed = -Math.max(1.2, Math.abs(player.speed) * 0.45);
                }
            } else if (obj.type.startsWith('star') && !obj.taken) {
                const yOffset = obj.type === 'star_high' ? WORLD_H * 0.26 : 34;
                const starY = groundY - yOffset;
                const dist = Math.hypot(player.x - screenX, (player.y - 22) - starY);
                if (dist < 42) {
                    obj.taken = true;
                    score += obj.val;
                    popups.push({ x: screenX, y: starY, text: '+' + obj.val, life: 40 });
                    playSound(obj.val === 10 ? 'megaDing' : 'ding');
                }
            }
        });
    }

    function drawSky() {
        const g = ctx.createLinearGradient(0, 0, 0, WORLD_H);
        g.addColorStop(0, '#5eb6de');
        g.addColorStop(0.55, '#c5ebf7');
        g.addColorStop(1, '#fff1b8');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, worldW, WORLD_H);

        ctx.beginPath();
        ctx.arc(worldW * 0.82, WORLD_H * 0.14, 22, 0, Math.PI * 2);
        ctx.fillStyle = '#ffe082';
        ctx.fill();
    }

    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function drawHUD() {
        const ui = Math.max(1, Math.min(1.45, viewH / 520));
        const pad = 12 * ui;
        ctx.fillStyle = 'rgba(255,253,245,0.86)';
        roundRect(pad, pad, 148 * ui, 58 * ui, 10 * ui);
        ctx.fill();
        ctx.fillStyle = '#222';
        ctx.font = `bold ${18 * ui}px Trebuchet MS, sans-serif`;
        ctx.fillText('Punti ' + score, pad + 12 * ui, pad + 24 * ui);
        for (let i = 0; i < lives; i++) drawHeart(pad + 20 * ui + i * 24 * ui, pad + 44 * ui, 1.15 * ui);

        const meterW = 124 * ui;
        const tx = viewW - meterW - pad;
        ctx.fillStyle = 'rgba(255,253,245,0.86)';
        roundRect(tx, pad, meterW, 58 * ui, 10 * ui);
        ctx.fill();
        ctx.fillStyle = '#444';
        ctx.font = `${12 * ui}px Trebuchet MS, sans-serif`;
        const danger = Math.abs(player.speed) > crashSpeedThreshold;
        ctx.fillText(danger ? 'PERICOLO' : 'KM/H', tx + (danger ? 24 * ui : 42 * ui), pad + 18 * ui);

        const speedPerc = Math.min(1, Math.abs(player.speed) / maxSpeed);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2 * ui;
        ctx.strokeRect(tx + 10 * ui, pad + 28 * ui, meterW - 20 * ui, 16 * ui);
        if (danger) ctx.fillStyle = '#d32f2f';
        else if (Math.abs(player.speed) > crashSpeedThreshold * 0.8) ctx.fillStyle = '#fb8c00';
        else ctx.fillStyle = '#455a64';
        ctx.fillRect(tx + 12 * ui, pad + 30 * ui, speedPerc * (meterW - 24 * ui), 12 * ui);
    }

    function draw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, viewW, viewH);

        const s = viewH / WORLD_H;
        ctx.save();
        ctx.scale(s, s);
        if (shake > 0) {
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake * 0.6);
        }

        drawSky();

        mountains.forEach(m => {
            ctx.save();
            ctx.translate(m.x, m.y);
            ctx.scale(m.scale, m.scale);
            ctx.beginPath();
            ctx.moveTo(0, 40);
            ctx.lineTo(110, -130);
            ctx.lineTo(220, 40);
            ctx.closePath();
            ctx.fillStyle = 'rgba(90, 110, 130, 0.28)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(60,70,80,0.4)';
            ctx.stroke();
            ctx.restore();
        });

        hills.forEach(h => {
            ctx.beginPath();
            ctx.ellipse(h.x + h.w / 2, WORLD_H * 0.78, h.w / 2, h.h, 0, Math.PI, 0);
            ctx.fillStyle = 'rgba(120, 160, 90, 0.22)';
            ctx.fill();
        });

        clouds.forEach(c => drawCloud(c.x, c.y, c.scale));

        ctx.beginPath();
        for (let x = -60; x < worldW + 60; x += 8) {
            const h = getTerrainHeight(worldXpos + x);
            if (x === -60) ctx.moveTo(x, h);
            else ctx.lineTo(x, h);
        }
        ctx.strokeStyle = '#2e4a1f';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.lineTo(worldW + 60, WORLD_H + 40);
        ctx.lineTo(-60, WORLD_H + 40);
        ctx.fillStyle = '#c5dd86';
        ctx.fill();

        ctx.beginPath();
        for (let x = -60; x < worldW + 60; x += 8) {
            const h = getTerrainHeight(worldXpos + x);
            if (x === -60) ctx.moveTo(x, h);
            else ctx.lineTo(x, h);
        }
        ctx.lineTo(worldW + 60, WORLD_H + 40);
        ctx.lineTo(-60, WORLD_H + 40);
        ctx.fillStyle = '#a7c96a';
        ctx.save();
        ctx.clip();
        ctx.fillRect(-60, WORLD_H * 0.82, worldW + 120, WORLD_H);
        ctx.restore();

        gameObjects.forEach(obj => {
            const screenX = obj.worldX - worldXpos;
            if (screenX < -50 || screenX > worldW + 50) return;
            const groundY = getTerrainHeight(obj.worldX);
            if (obj.type === 'rock') {
                drawRock(screenX, groundY);
            } else if (obj.type.startsWith('star') && !obj.taken) {
                const yOffset = obj.type === 'star_high' ? WORLD_H * 0.26 : 34;
                drawStar(screenX, groundY - yOffset, obj.type === 'star_high' ? 'high' : 'low');
            }
        });

        popups.forEach(p => {
            ctx.globalAlpha = Math.min(1, p.life / 20);
            ctx.fillStyle = '#e65100';
            ctx.font = 'bold 16px Trebuchet MS, sans-serif';
            ctx.fillText(p.text, p.x - 10, p.y);
            ctx.globalAlpha = 1;
        });

        if (gameState !== 'start') drawPlayer();
        ctx.restore();

        if (gameState === 'playing' || gameState === 'gameover') {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawHUD();
        }
    }

    function loop(now) {
        if (!lastTime) lastTime = now;
        let dt = (now - lastTime) / (1000 / 60);
        lastTime = now;
        if (dt > 3) dt = 3;
        update(dt);
        collideObjects();
        draw();
        requestAnimationFrame(loop);
    }

    resize();
    initWorld();
    setOverlayCopy();
    requestAnimationFrame(loop);
</script>
</body>
</html>
