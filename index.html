<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#fffdf5">
    <title>Omino Stick: Hill Climb (Mobile Controls)</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        /* Header con Titolo e Tasto Fullscreen */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 95vw;
            max-width: 600px;
            margin-bottom: 5px;
        }

        h1 { margin: 0; color: #333; font-size: 18px; }

        .btn-fullscreen {
            background: none;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 20px;
            padding: 2px 8px;
            background-color: white;
        }

        #gameContainer {
            position: relative;
            border: 2px solid #333;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            border-radius: 4px;
            background-color: #fffdf5; 
            width: 95vw;
            max-width: 600px; 
            aspect-ratio: 16/9; 
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            border-radius: 2px;
        }

        /* Pulsantiera Mobile */
        .mobile-controls {
            display: flex;
            justify-content: space-between;
            width: 95vw;
            max-width: 600px;
            margin-top: 15px;
            gap: 10px;
        }

        .control-btn {
            background: #fff;
            border: 2px solid #333;
            border-radius: 12px;
            flex: 1; 
            height: 70px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px; 
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 0 #999;
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active, .control-btn.pressed {
            transform: translateY(4px);
            box-shadow: 0 0 0 #999;
            background-color: #eee;
        }

        .btn-brake { color: #d00; }
        .btn-pedal { color: #009900; }
        .btn-jump { color: #0000cc; font-size: 36px; }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border: 3px solid black;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
            z-index: 10;
            width: 80%;
            pointer-events: none; /* Importante per cliccare attraverso */
        }
        
        #overlay h2 { margin-top: 0; color: #c00; font-size: 1.4em; }
        #overlay p { font-size: 0.9em; line-height: 1.3em; margin-bottom: 5px; }
        
        .controls-info {
            margin-top: 10px;
            font-size: 0.7em;
            color: #555;
            text-align: center;
        }

        @media (min-width: 700px) {
             .mobile-controls { max-width: 500px; }
             #gameContainer { max-width: 600px; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>Omino Stick: Hill Climb</h1>
        <button class="btn-fullscreen" id="fsBtn" title="Schermo Intero">⛶</button>
    </div>
    
    <div id="gameContainer">
        <!-- Risoluzione interna -->
        <canvas id="gameCanvas" width="600" height="340"></canvas>
        
        <div id="overlay">
            <h2 id="overlayTitle">TOCCA PER INIZIARE</h2>
            <p id="overlaySub">
                Usa i pulsanti sotto per guidare.<br>
                Stelle = Punti<br>
                Rocce = Pericolo!
            </p>
        </div>
    </div>
    
    <!-- Pulsantiera -->
    <div class="mobile-controls">
        <button class="control-btn btn-brake" id="btnLeft">🛑</button>
        <button class="control-btn btn-jump" id="btnUp">⬆️</button>
        <button class="control-btn btn-pedal" id="btnRight">➡️</button>
    </div>
    
    <div class="controls-info">
        (Frena - Salta - Pedala)
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const title = document.getElementById('overlayTitle');
    const sub = document.getElementById('overlaySub');
    const fsBtn = document.getElementById('fsBtn');

    // Bottoni
    const btnLeft = document.getElementById('btnLeft');
    const btnUp = document.getElementById('btnUp');
    const btnRight = document.getElementById('btnRight');

    // --- FULLSCREEN LOGIC ---
    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`Error attempting to enable full-screen mode: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    });

    // --- AUDIO SYSTEM ---
    let audioCtx = null;
    let windSystem = null;
    let audioStarted = false;

    function initAudio() {
        if (audioStarted) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;
            
            const windFilter = audioCtx.createBiquadFilter();
            windFilter.type = 'lowpass';
            windFilter.frequency.value = 200;
            
            const windGain = audioCtx.createGain();
            windGain.gain.value = 0;

            whiteNoise.connect(windFilter);
            windFilter.connect(windGain);
            windGain.connect(audioCtx.destination);
            
            whiteNoise.start(0);
            windSystem = { filter: windFilter, gain: windGain };
            audioStarted = true;
        } catch (e) { console.error("Audio error:", e); }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (type === 'ding') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        } else if (type === 'megaDing') {
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        } else if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        } else if (type === 'hit') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 1);
    }

    // --- GAME STATE ---
    let gameState = 'start'; // start, playing, gameover
    let frame = 0;
    let score = 0;
    let lives = 3;
    let worldXpos = 0;
    let loopRunning = false; // Flag per controllare il loop
    
    // Fisica
    const gravity = 0.5;
    const slopeGravityForce = 0.35;
    const friction = 0.99;
    const groundFriction = 0.96;
    const brakePower = 0.8;
    const pedalPower = 0.3;
    const maxSpeed = 18; 
    const crashSpeedThreshold = 12;

    let player = {
        x: 100,
        y: 0,
        vy: 0,
        jumpPower: -13,
        speed: 0,
        rotation: 0,
        onGround: false,
        isInvincible: false,
        invincibleTimer: 0
    };

    let gameObjects = []; 
    let mountains = [];
    let clouds = [];

    const keys = { up: false, left: false, right: false };
    
    // Inizializza gli oggetti (ma non inizia il gioco)
    function initWorld() {
        mountains = Array.from({length: 5}, () => ({
            x: Math.random() * canvas.width, 
            y: 150 + Math.random() * 100, 
            scale: 0.5 + Math.random() * 0.5
        }));
        clouds = Array.from({length: 8}, () => ({
            x: Math.random() * canvas.width * 2, 
            y: 30 + Math.random() * 80, 
            speed: 0.2 + Math.random() * 0.3
        }));
    }

    function resetGame() {
        gameState = 'playing';
        score = 0;
        lives = 3;
        worldXpos = 0;
        player.y = 0;
        player.vy = 0;
        player.speed = 0;
        player.rotation = 0;
        player.onGround = false;
        player.isInvincible = false;
        
        gameObjects = [];
        // Ricrea montagne per variare lo scenario
        initWorld();
        
        overlay.style.display = 'none';
        initAudio(); 
    }

    // --- INPUT GESTIONE BOTTONI ---
    function setupButton(btn, keyName) {
        const startAction = (e) => {
            if (e.cancelable) e.preventDefault();
            if (gameState === 'playing') {
                keys[keyName] = true;
                btn.classList.add('pressed');
            }
        };
        const endAction = (e) => {
            if (e.cancelable) e.preventDefault();
            keys[keyName] = false;
            btn.classList.remove('pressed');
        };

        btn.addEventListener('mousedown', startAction);
        btn.addEventListener('touchstart', startAction, {passive: false});
        
        btn.addEventListener('mouseup', endAction);
        btn.addEventListener('mouseleave', endAction);
        btn.addEventListener('touchend', endAction, {passive: false});
    }

    setupButton(btnLeft, 'left');
    setupButton(btnUp, 'up');
    setupButton(btnRight, 'right');

    function handleCanvasInteract(e) {
        if (e.cancelable) e.preventDefault();
        if (gameState === 'start' || gameState === 'gameover') {
            resetGame();
        }
    }
    
    canvas.addEventListener('mousedown', handleCanvasInteract);
    canvas.addEventListener('touchstart', handleCanvasInteract, {passive: false});

    window.addEventListener('keydown', (e) => {
        if (gameState !== 'playing') return;
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') { keys.up = true; btnUp.classList.add('pressed'); }
        if (k === 'a' || e.key === 'ArrowLeft') { keys.left = true; btnLeft.classList.add('pressed'); }
        if (k === 's' || e.key === 'ArrowRight') { keys.right = true; btnRight.classList.add('pressed'); }
    });
    window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w' || e.key === 'ArrowUp') { keys.up = false; btnUp.classList.remove('pressed'); }
        if (k === 'a' || e.key === 'ArrowLeft') { keys.left = false; btnLeft.classList.remove('pressed'); }
        if (k === 's' || e.key === 'ArrowRight') { keys.right = false; btnRight.classList.remove('pressed'); }
    });

    // --- GENERAZIONE TERRENO ---
    function getTerrainHeight(worldX) {
        const base = 250; 
        const h1 = Math.sin(worldX * 0.0025) * 70;
        const h2 = Math.sin(worldX * 0.008) * 20;
        return base + h1 + h2;
    }

    // --- DISEGNO ---
    function drawHandLine(x1, y1, x2, y2, width = 2) {
        ctx.beginPath();
        let mx = (x1+x2)/2 + (Math.random()-0.5)*2;
        let my = (y1+y2)/2 + (Math.random()-0.5)*2;
        ctx.moveTo(x1, y1); ctx.lineTo(mx, my); ctx.lineTo(x2, y2);
        ctx.lineWidth = width; ctx.strokeStyle = '#000'; ctx.lineCap = 'round'; ctx.stroke();
    }

    function drawCircle(x, y, r, style = 'stroke') {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI*2);
        if (style === 'stroke') {
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
        } else {
            ctx.fillStyle = '#d00'; ctx.fill(); ctx.stroke();
        }
    }

    function drawCloud(x, y) {
        ctx.save(); ctx.translate(x, y); ctx.fillStyle = 'white'; ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-30, 10); ctx.lineTo(30, 10);
        ctx.bezierCurveTo(40, 10, 40, -20, 20, -25);
        ctx.bezierCurveTo(10, -35, -10, -35, -20, -25);
        ctx.bezierCurveTo(-40, -20, -40, 10, -30, 10);
        ctx.fill(); ctx.stroke(); ctx.restore();
    }

    function drawHeart(x, y, size) {
        ctx.save(); ctx.translate(x, y); ctx.scale(size, size); ctx.beginPath();
        ctx.moveTo(0,0); ctx.bezierCurveTo(-5,-5, -10,0, 0,10); ctx.bezierCurveTo(10,0, 5,-5, 0,0);
        ctx.fillStyle = '#e00'; ctx.fill(); ctx.restore();
    }

    function drawRock(x, y) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 10, y - 15); ctx.lineTo(x + 20, y - 5);
        ctx.lineTo(x + 30, y - 20); ctx.lineTo(x + 40, y); ctx.closePath();
        ctx.fillStyle = '#999'; ctx.fill(); ctx.strokeStyle = 'black'; ctx.lineWidth = 2; ctx.stroke();
    }

    function drawStar(x, y, type) {
        let size = type === 'high' ? 12 : 7; 
        let spikes = 5; let rot = Math.PI/2*3; let step = Math.PI/spikes;
        ctx.beginPath(); ctx.moveTo(x, y-size);
        for (let i=0; i<spikes; i++) {
            ctx.lineTo(x+Math.cos(rot)*size, y+Math.sin(rot)*size); rot+=step;
            ctx.lineTo(x+Math.cos(rot)*(size/2), y+Math.sin(rot)*(size/2)); rot+=step;
        }
        ctx.lineTo(x, y-size); ctx.closePath();
        ctx.lineWidth=2; ctx.strokeStyle='black'; ctx.stroke();
        ctx.fillStyle = type==='high'?'#ffaa00':'#ffdb4d'; ctx.fill();
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.rotation);

        if (player.isInvincible && frame % 10 < 5) ctx.globalAlpha = 0.5;

        drawCircle(-20, 0, 12); drawCircle(20, 0, 12);  
        drawHandLine(-20, 0, 0, -20); drawHandLine(20, 0, 0, -20);
        drawHandLine(-15, 0, 5, -25); drawHandLine(20, 0, 8, -30);  

        ctx.translate(0, -5); 
        drawHandLine(0, -20, -5, -40); drawCircle(-5, -48, 7); drawHandLine(-5, -35, 15, -25); 
        let knee = Math.sin(frame * player.speed * 0.3) * 5;
        drawHandLine(-5, -20, -2 + knee, -5 - knee); drawHandLine(-2 + knee, -5 - knee, 0, 5);
        
        ctx.restore();
    }

    // --- LOGICA ---
    function handleCrash() {
        if (player.isInvincible) return;

        if (lives > 1) {
            lives--;
            playSound('hit');
            player.speed = -player.speed * 0.5;
            player.isInvincible = true;
            player.invincibleTimer = 120; 
        } else {
            lives = 0;
            playSound('crash');
            gameState = 'gameover';
            setTimeout(() => {
                title.innerText = "GAME OVER";
                sub.innerHTML = "Punteggio: " + score + "<br>(Tocca il riquadro per riprovare)";
                overlay.style.display = 'flex'; // Torna visibile
            }, 500);
        }
    }

    function updateBackground() {
        // Muove nuvole e sfondo anche se il gioco è in pausa/menu
        let speed = (gameState === 'playing') ? player.speed : 1; 
        clouds.forEach(c => { c.x -= speed * 0.1 + c.speed; if(c.x < -100) c.x = canvas.width*2; });
        mountains.forEach(m => { m.x -= speed * 0.05; if(m.x < -300) m.x = canvas.width + 200; });
    }

    function update() {
        // Logica di sfondo sempre attiva
        updateBackground();

        if (gameState !== 'playing') return;

        if (player.isInvincible) {
            player.invincibleTimer--;
            if (player.invincibleTimer <= 0) player.isInvincible = false;
        }

        let currentGroundY = getTerrainHeight(worldXpos + player.x);
        let nextGroundY = getTerrainHeight(worldXpos + player.x + 5);
        let slopeAngle = Math.atan2(nextGroundY - currentGroundY, 5);

        player.speed += Math.sin(slopeAngle) * slopeGravityForce;

        if (keys.right) player.speed += pedalPower;
        else if (player.onGround) player.speed *= groundFriction; 
        else player.speed *= friction;

        if (keys.left) {
            if (player.speed > 0) player.speed -= brakePower;
            else player.speed += brakePower * 0.2;
        }

        if (player.speed > maxSpeed) player.speed = maxSpeed;
        if (player.speed < -5) player.speed = -5; 

        if (keys.up && player.onGround) {
            player.vy = player.jumpPower;
            player.onGround = false;
            if(slopeAngle < 0) player.speed += 2; 
        }

        player.vy += gravity;
        player.y += player.vy;

        currentGroundY = getTerrainHeight(worldXpos + player.x);
        if (player.y >= currentGroundY - 5) {
            player.y = currentGroundY;
            player.vy = 0;
            player.onGround = true;
            player.rotation = slopeAngle;
        } else {
             player.rotation *= 0.95; 
        }
        
        worldXpos += player.speed;
        
        if (windSystem) {
             let vol = Math.abs(player.speed)/20;
             windSystem.gain.gain.setTargetAtTime(Math.min(vol, 0.2), audioCtx.currentTime, 0.1);
             windSystem.filter.frequency.setTargetAtTime(200 + (Math.abs(player.speed)*800), audioCtx.currentTime, 0.1);
        }

        // Oggetti
        let spawnX = worldXpos + canvas.width + 100;
        
        if (gameObjects.length === 0 || gameObjects[gameObjects.length-1].worldX < spawnX - 250) {
            let rand = Math.random();
            let newObjX = spawnX + Math.random() * 100;
            if (rand < 0.3) gameObjects.push({ type: 'rock', worldX: newObjX, w: 40, h: 20 });
            else if (rand < 0.7) gameObjects.push({ type: 'star_low', worldX: newObjX, val: 1, taken: false });
            else if (rand < 0.9) gameObjects.push({ type: 'star_high', worldX: newObjX, val: 10, taken: false });
        }
        
        gameObjects = gameObjects.filter(obj => obj.worldX > worldXpos - 200);

        frame++;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        mountains.forEach(m => {
            ctx.save(); ctx.translate(m.x, m.y); ctx.scale(m.scale, m.scale);
            ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(100,-150); ctx.lineTo(200,0); 
            ctx.strokeStyle = '#888'; ctx.stroke(); ctx.restore();
        });
        clouds.forEach(c => drawCloud(c.x, c.y));

        ctx.beginPath();
        for (let x = -50; x < canvas.width + 50; x += 10) {
            let h = getTerrainHeight(worldXpos + x);
            if (x===-50) ctx.moveTo(x, h); else ctx.lineTo(x, h);
        }
        ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke();
        ctx.lineTo(canvas.width+50, canvas.height); ctx.lineTo(-50, canvas.height);
        ctx.fillStyle = '#fffdf5'; ctx.fill();

        // Disegna oggetti solo se attivi (o sempre per semplicità, tanto escono dallo schermo)
        gameObjects.forEach(obj => {
            let screenX = obj.worldX - worldXpos;
            if (screenX > -50 && screenX < canvas.width + 50) {
                let groundY = getTerrainHeight(obj.worldX);
                
                if (obj.type === 'rock') {
                    drawRock(screenX, groundY);
                    if (gameState === 'playing' && Math.abs(player.x - screenX - 20) < 25 && player.y > groundY - 25) {
                        if (Math.abs(player.speed) > crashSpeedThreshold) handleCrash();
                        else player.speed = -player.speed * 0.5;
                    }
                } else if (obj.type.startsWith('star') && !obj.taken) {
                    let yOffset = obj.type === 'star_high' ? 100 : 30;
                    let starY = groundY - yOffset;
                    let starType = obj.type === 'star_high' ? 'high' : 'low';
                    drawStar(screenX, starY, starType);
                    
                    if (gameState === 'playing') {
                        let dist = Math.sqrt( Math.pow(player.x - screenX, 2) + Math.pow((player.y - 20) - starY, 2) );
                        if (dist < 40) {
                            obj.taken = true;
                            score += obj.val;
                            playSound(obj.val === 10 ? 'megaDing' : 'ding');
                        }
                    }
                }
            }
        });

        if (gameState !== 'start') drawPlayer();

        if (gameState === 'playing' || gameState === 'gameover') {
            ctx.fillStyle = "#333";
            ctx.font = "bold 20px Comic Sans MS";
            ctx.fillText("Punti: " + score, 20, 30);
            
            for (let i = 0; i < lives; i++) drawHeart(20 + i * 25, 60, 1.2);

            let tx = canvas.width - 100;
            ctx.fillStyle = "#333"; ctx.font = "14px Comic Sans MS"; ctx.fillText("KM/H", tx + 20, 80);
            let speedPerc = Math.abs(player.speed) / maxSpeed;
            if(speedPerc > 1) speedPerc = 1;
            ctx.strokeRect(tx, 40, 80, 20);
            
            if (Math.abs(player.speed) > crashSpeedThreshold) ctx.fillStyle = '#d00';
            else if (Math.abs(player.speed) > crashSpeedThreshold * 0.8) ctx.fillStyle = '#fa0';
            else ctx.fillStyle = '#444';
            
            ctx.fillRect(tx + 2, 42, speedPerc * 76, 16);
            
            if (Math.abs(player.speed) > crashSpeedThreshold) {
                ctx.fillStyle = '#d00'; ctx.font = "bold 12px Comic Sans MS"; ctx.fillText("PERICOLO!", tx + 5, 35);
            }
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }
    
    // Avvio iniziale (Una volta sola)
    initWorld();
    loop();

</script>
</body>
</html>
